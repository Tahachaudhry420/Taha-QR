<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taha's Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100c19;
    --bg-2: #191228;
    --glow: #b28bff;
    --glow-soft: #7a5cc4;
    --text: #f1ecff;
    --muted: #a99fc4;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --fb: #3d6fd6;
    --wa: #35b567;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #100c19;
      --bg-2: #191228;
      --text: #f1ecff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }
  .aura {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--glow-soft) 0%, transparent 65%);
    opacity: 0.35;
    filter: blur(10px);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--glow), var(--glow-soft));
    box-shadow: 0 0 40px rgba(178, 139, 255, 0.45);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 2.4rem;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 34px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 20px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    font-weight: 500;
    font-size: 1rem;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
  }
  .icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 20px; height: 20px; }
  .icon.fb { background: var(--fb); }
  .icon.wa { background: var(--wa); }
  .link-text { text-align: left; }
  .link-text .label { display: block; font-weight: 600; }
  .link-text .sub { display: block; font-size: 0.8rem; color: var(--muted); font-weight: 400; }
  footer {
    margin-top: 40px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="aura"></div>
  <div class="card">
    <div class="avatar"></div>
    <h1>Taha's Aura</h1>
    <p class="tagline">Find me on socials & say hello</p>
    <div class="links">
      <a class="link" href="https://www.facebook.com/taha.aurangzaib.2025" target="_blank" rel="noopener">
        <span class="icon fb">

        </span>
        <span class="link-text">

        </span>
        <span class="link-text">
          <span class="label">WhatsApp</span>
          <span class="sub">0314 333 1870</span>
        </span>
      </a>
    </div>
    <footer>&copy; Taha's Aura</footer>
  </div>
</body>
</html>
